apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dp-nessie-postgres
  namespace: data-infra
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nessie-postgres
      app.kubernetes.io/component: metastore
      app.kubernetes.io/instance: dp
  serviceName: dp-postgres
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nessie-postgres
        app.kubernetes.io/component: metastore
        app.kubernetes.io/instance: dp
    # TODO: add replicas and workers
    spec:
      containers:
      - name: postgres-metastore
        image: postgres:18.3
        resources:
          requests:
            cpu: 200m
            memory: 200Mi
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: metastore-secrets
              key: postgres_password
        - name: POSTGRES_DB
          value: catalog
        - name: POSTGRES_INITDB_ARGS
          value: --encoding UTF8 --data-checksums
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 15
        volumeMounts:
        - name: dp-nessie-postgres-volume
          mountPath: /var/lib/postgresql

  volumeClaimTemplates:
  - metadata:
      name: dp-nessie-postgres-volume
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
