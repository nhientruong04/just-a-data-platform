apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dp-minio
  namespace: data-infra
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
      app.kubernetes.io/component: storage
      app.kubernetes.io/instance: dp
  serviceName: dp-minio-hl
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: storage
        app.kubernetes.io/instance: dp
    spec:
      containers:
      - name: minio
        image: quay.io/minio/RELEASE.2025-09-07T16-13-09Z-cpuv1
        command: ["minio", "server"]
        args: ["/mnt/storage"] # TODO: map this to replaceable var
        ports:
        - containerPort: 9000
        - containerPort: 9090
        env:
          - name: MINIO_ROOT_USER
            valueFrom:
              secretKeyRef:
                name: infra-secrets
                key: minio_user
          - name: MINIO_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: infra-secrets
                key: minio_password
          - name: MINIO_ADDRESS
            value: 9000
          - name: MINIO_CONSOLE_ADDRESS
            value: :9090
