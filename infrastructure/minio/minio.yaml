apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dp-minio
  namespace: data-infra
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
      app.kubernetes.io/component: storage
      app.kubernetes.io/instance: dp
  serviceName: dp-minio-endpoint
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: storage
        app.kubernetes.io/instance: dp
    spec:
      containers:
      - name: minio
        image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
        command: ["minio", "server"]
        args: ["/data"]
        resources:
          requests:
            cpu: 500m
            memory: 256Mi
        ports:
        - containerPort: 9000
        - containerPort: 9090
        env:
          - name: MINIO_ROOT_USER
            valueFrom:
              secretKeyRef:
                name: infra-secrets
                key: minio_user
          - name: MINIO_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: infra-secrets
                key: minio_password
          - name: MINIO_ADDRESS
            value: ":9000"
          - name: MINIO_CONSOLE_ADDRESS
            value: ":9090"
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
            scheme: HTTP
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 15
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: dp-minio-volume
          mountPath: /data

      - name: minio-startup
        image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
        command:
        - "/bin/bash"
        - "-c"
        - |
          set -e

          until curl -f http://localhost:9000/minio/health/ready; do
            echo 'Waiting for MinIO...'
            sleep 2
          done
          mc alias set myminio http://localhost:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD
          mc admin info myminio
          mc mb myminio/datalake-bronze-zone --ignore-existing
        restartPolicy: Never
        env:
          - name: MINIO_ROOT_USER
            valueFrom:
              secretKeyRef:
                name: infra-secrets
                key: minio_user
          - name: MINIO_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: infra-secrets
                key: minio_password

  volumeClaimTemplates:
  - metadata:
      name: dp-minio-volume
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
