apiVersion: apps/v1
kind: Deployment
metadata:
  name: dp-spark-server
  namespace: data-infra
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: spark-server
      app.kubernetes.io/component: data-engine
      app.kubernetes.io/instance: dp
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spark-server
        app.kubernetes.io/component: data-engine
        app.kubernetes.io/instance: dp
    spec:
      initContainers:
      - name: nessie-check
        image: busybox:latest
        command:
        - /bin/sh
        - -c
        - |
          until wget -qO- http://dp-nessie-endpoint:9000/q/health; do
            echo 'Waiting for nessie...'
            sleep 2
          done

      containers:
      - name: spark-thrift-server
        image: nhientruong/data-platform:spark-3.5.8-nessie
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 1000m
            memory: 2000Mi
          limits:
            cpu: 2000m
            memory: 4000Mi
        args: [/opt/spark/sbin/start-thriftserver.sh]
        livenessProbe:
          tcpSocket:
            port: 10000
          initialDelaySeconds: 50
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 15
        readinessProbe:
          tcpSocket:
            port: 10000
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 6
        env:
        - name: SPARK_NO_DAEMONIZE
          value: "true"

        volumeMounts:
        - name: spark-config
          mountPath: /opt/spark/conf

      volumes:
      - name: spark-config
        configMap:
          name: spark-thrift-config
