apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "minio.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "minio.selectorLabels" . | nindent 4 }}
  ports:
  - name: minio-admin-portal
    protocol: TCP
    port: {{ .Values.service.ports.console }}
    targetPort: {{ .Values.service.ports.console }}
  - name: minio-api
    protocol: TCP
    port: {{ .Values.service.ports.api }}
    targetPort: {{ .Values.service.ports.api }}
