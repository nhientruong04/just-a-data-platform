apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "minio.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "minio.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "minio.selectorLabels" . | nindent 6 }}
  serviceName: {{ .Values.service.name }}
  replicas: {{ .Values.replicaCount }}
  template:
    metadata:
      labels:
        {{- include "minio.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: minio
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: {{ toYaml .Values.command | nindent 8 }}
        args: {{ toYaml .Values.args | nindent 8 }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.auth.secret.name }}
              key: {{ .Values.auth.secret.userKey }}
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.auth.secret.name }}
              key: {{ .Values.auth.secret.passwordKey }}
        - name: MINIO_ADDRESS
          value: {{ .Values.env.minioAddress | quote }}
        - name: MINIO_CONSOLE_ADDRESS
          value: {{ .Values.env.minioConsoleAddress | quote }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
        volumeMounts:
        - name: {{ .Values.persistence.volumeName }}
          mountPath: {{ .Values.persistence.mountPath }}
  volumeClaimTemplates:
  - metadata:
      name: {{ .Values.persistence.volumeName }}
    spec:
      accessModes:
      - {{ .Values.persistence.accessMode }}
      resources:
        requests:
          storage: {{ .Values.persistence.size }}
