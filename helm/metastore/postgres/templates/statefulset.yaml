apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "nessie-postgres.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nessie-postgres.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "nessie-postgres.selectorLabels" . | nindent 6 }}
  serviceName: {{ .Values.service.name }}
  replicas: {{ .Values.replicaCount }}
  template:
    metadata:
      labels:
        {{- include "nessie-postgres.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: postgres-metastore
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        env:
        - name: POSTGRES_USER
          value: {{ .Values.auth.user }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.auth.secret.name }}
              key: {{ .Values.auth.secret.passwordKey }}
        - name: POSTGRES_DB
          value: {{ .Values.auth.database }}
        - name: POSTGRES_INITDB_ARGS
          value: {{ .Values.initdbArgs }}
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "{{ .Values.auth.user }}"]
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 15
        volumeMounts:
        - name: {{ .Values.persistence.volumeName }}
          mountPath: /var/lib/postgresql
  volumeClaimTemplates:
  - metadata:
      name: {{ .Values.persistence.volumeName }}
    spec:
      accessModes:
      - {{ .Values.persistence.accessMode }}
      resources:
        requests:
          storage: {{ .Values.persistence.size }}
