apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nessie-postgres.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "nessie-postgres.selectorLabels" . | nindent 4 }}
  ports:
  - name: postgres-endpoint
    protocol: TCP
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.port }}
