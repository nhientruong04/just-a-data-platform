apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: data-prod-fake-prod-database
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: data-platform
  path: ./clusters/local/data-prod/database/fake-prod-database
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
  - name: namespaces
  - name: data-prod-prod-postgres-secret
