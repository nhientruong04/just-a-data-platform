apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prod-postgres-database
  namespace: flux-system
spec:
  interval: 5m
  releaseName: prod-postgres-database
  targetNamespace: data-prod
  chart:
    spec:
      chart: ./helm/fake-prod-database
      sourceRef:
        kind: GitRepository
        name: data-platform
        namespace: flux-system
      interval: 5m
