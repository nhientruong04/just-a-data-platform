apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: strimzi
  namespace: flux-system
spec:
  interval: 12h
  url: https://strimzi.io/charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: strimzi-cluster-operator
  namespace: flux-system
spec:
  interval: 30m
  releaseName: strimzi-cluster-operator
  targetNamespace: data-infra
  chart:
    spec:
      chart: strimzi-kafka-operator
      version: "1.0.0"
      sourceRef:
        kind: HelmRepository
        name: strimzi
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
