apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: data-infra-kafka-connect
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: data-platform
  path: ./clusters/local/data-infra/kafka/connect
  prune: true
  wait: true
  timeout: 20m
  dependsOn:
  - name: data-infra-kafka-cluster
  - name: data-infra-platform-secrets
  - name: data-infra-prod-postgres-secret
  - name: data-infra-apicurio
