apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: akhq
  namespace: flux-system
spec:
  interval: 12h
  url: https://akhq.io/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: akhq
  namespace: flux-system
spec:
  interval: 30m
  releaseName: akhq
  targetNamespace: data-infra
  chart:
    spec:
      chart: akhq
      version: "0.27.0"
      sourceRef:
        kind: HelmRepository
        name: akhq
        namespace: flux-system
      interval: 12h
  valuesFrom:
  - kind: ConfigMap
    name: akhq-values
    valuesKey: values.yaml
