apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: data-infra-nessie-postgres
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: data-platform
  path: ./clusters/local/data-infra/metastore/postgres
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
  - name: namespaces
  - name: data-infra-platform-secrets
