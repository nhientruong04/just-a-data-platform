apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: trino
  namespace: flux-system
spec:
  interval: 12h
  url: https://trinodb.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trino
  namespace: flux-system
spec:
  timeout: 30m
  interval: 5m
  releaseName: trino
  targetNamespace: data-infra
  chart:
    spec:
      chart: trino
      version: "1.42.2"
      sourceRef:
        kind: HelmRepository
        name: trino
        namespace: flux-system
      interval: 12h
  valuesFrom:
  - kind: ConfigMap
    name: trino-values
    valuesKey: values.yaml
