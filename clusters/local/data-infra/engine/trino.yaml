apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: data-infra-trino
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: data-platform
  path: ./clusters/local/data-infra/engine/trino
  prune: true
  wait: true
  timeout: 8m
  dependsOn:
  - name: data-infra-nessie
